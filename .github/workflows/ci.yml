name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Go server (build / vet / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: server/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  web:
    name: Web (test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go is set up so the full-stack integration test (which spawns the relay)
      # runs instead of self-skipping.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        env:
          GO_BIN: go
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
